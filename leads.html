<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads — MarveloWeb</title>
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://marveloweb-api.twilight-frog-a541.workers.dev https://api.marveloweb.com http://localhost:8787; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#0F0F12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F0F12'/%3E%3Cpath d='M16 5l2.6 8.4L27 16l-8.4 2.6L16 27l-2.6-8.4L5 16l8.4-2.6z' fill='%23FF3D7F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
  <link rel="stylesheet" href="leads.css?v=3">
</head>
<body class="leads">
  <header class="leads__bar">
    <div class="wrap leads__bar-inner">
      <a class="logo" href="./" aria-label="MarveloWeb home">
        <svg class="logo__spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.9 8.1L23 12l-8.1 2.9L12 23l-2.9-8.1L1 12l8.1-2.9z"/></svg>
        <span>marvelo<b>web</b></span>
      </a>
      <span class="leads__tag">Leads</span>
    </div>
  </header>

  <main class="wrap leads__main" id="main">
    <p class="leads__off" id="off" hidden></p>

    <form class="leads__login" id="login" hidden>
      <h1>Admin key</h1>
      <p>Enter your admin key to see your leads. It is kept on this device only.</p>
      <label for="key">Admin key</label>
      <div class="leads__row">
        <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <button class="btn btn--ink" type="submit">Show leads</button>
      </div>
      <p class="leads__error" id="login-error" role="alert"></p>
    </form>

    <section class="leads__app" id="app" hidden>
      <div class="leads__head">
        <h1>Leads <span class="leads__count" id="count"></span></h1>
        <div class="leads__tools">
          <label class="sr" for="search">Search leads</label>
          <input id="search" type="search" placeholder="Search name, email, site, city…" autocomplete="off">
          <button class="btn btn--pink" type="button" id="csv">Download CSV</button>
          <button class="btn btn--ghost" type="button" id="forget">Forget this device</button>
        </div>
      </div>
      <p class="leads__status" id="status" role="status"></p>
      <div class="leads__scroller" id="scroller" tabindex="0" aria-label="Leads table, scrolls sideways">
        <table class="leads__table">
          <thead>
            <tr>
              <th scope="col"><span class="sr">Details</span></th>
              <th scope="col">Date</th>
              <th scope="col">Name</th>
              <th scope="col">Email</th>
              <th scope="col">Phone</th>
              <th scope="col">Website</th>
              <th scope="col">City</th>
              <th scope="col">Business type</th>
              <th scope="col">Warning signs</th>
              <th scope="col">Score</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="leads.js?v=3"></script>
</body>
</html>
